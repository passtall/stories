<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>244 Geschichten bewerten</title><style>body{background:#111827;color:#f3f4f6;font:16px system-ui;margin:0 auto;max-width:950px;padding:24px}header{position:sticky;top:0;background:#111827f5;padding:12px 0;border-bottom:1px solid #374151}input{padding:12px;background:#1f2937;color:white;border:1px solid #4b5563;border-radius:8px;width:min(90%,500px)}button{cursor:pointer;padding:8px 11px;border:0;border-radius:5px;background:#374151;color:white}button:hover{background:#4b5563}.story{padding:15px 0;border-bottom:1px solid #374151}.title{font-weight:700}.desc{font-size:14px;color:#cbd5e1;margin:5px 0}.stars button{font-size:25px;background:transparent;color:#6b7280;padding:3px}.stars button.on{color:#fbbf24}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.primary{background:#2563eb}.small{font-size:13px;color:#9ca3af}#status{font-weight:700}</style><header><h1>Geschichten bewerten</h1><p>1 Stern = langweilig · 5 Sterne = hervorragend. Ausführlichere Erinnerungsabsätze; Bewertungen bleiben auf diesem Gerät gespeichert.</p><input id="search" placeholder="Geschichte oder Ereignis suchen ..."><div class="actions"><button id="all">Alle</button><button id="unrated">Nur unbewertete</button><button class="primary" id="export">Bewertungen als JSON herunterladen</button><button id="copy">JSON kopieren</button></div><div id="status"></div></header><main id="list"></main><script>const stories=[{"id":1,"title":"Kalachi sleeping village, Kazakhstan","summary":"Ein Dorf in Kasachstan wurde von rätselhaften Schlafanfällen heimgesucht. Bewohner fielen unvermittelt in einen tiefen Schlaf; als Ursache wurden unter anderem Gase aus Bergwerken untersucht."},{"id":2,"title":"Sunspot Solar Observatory evacuation, 2018","summary":"Ein Sonnenobservatorium in New Mexico wurde plötzlich geräumt und vom FBI abgeriegelt. Die Geheimhaltung schürte wilde Gerüchte, obwohl sich die Ermittlungen gegen einen Mitarbeiter richteten."},{"id":3,"title":"Cicada 3301","summary":"Unbekannte veröffentlichten extrem anspruchsvolle Rätsel mit Kryptografie, Literatur und realen Fundorten. Wer die Prüfungen von Cicada 3301 organisierte und wozu, blieb ungeklärt."},{"id":4,"title":"Toynbee Tiles","summary":"An Straßen in mehreren Städten erschienen geheimnisvolle Platten mit Botschaften über Jupiter und Auferstehung. Die Suche nach ihrem Urheber wurde selbst zu einem Rätsel."},{"id":5,"title":"UVB-76 “The Buzzer”","summary":"Ein russischer Kurzwellensender sendet seit Jahrzehnten ein monotones Summen, gelegentlich unterbrochen von verschlüsselten Meldungen. Sein genauer militärischer Zweck ist nicht öffentlich geklärt."},{"id":6,"title":"Vela Incident, 1979","summary":"Ein amerikanischer Satellit registrierte 1979 einen Doppelblitz im Südatlantik, typisch für eine mögliche Atomexplosion. Ob es sich wirklich um einen geheimen Nukleartest handelte, ist umstritten."},{"id":7,"title":"The Bloop","summary":"Unterwassermikrofone registrierten ein gewaltiges unbekanntes Geräusch im Pazifik. Die Spekulationen über gigantische Lebewesen wurden später durch die plausible Erklärung von Eisbrüchen verdrängt."},{"id":8,"title":"Yamal","summary":"In der sibirischen Tundra tauchten gewaltige Krater auf. Forscher führten sie auf explosionsartige Freisetzung von Gas im tauenden Permafrost zurück."},{"id":9,"title":"Saiga antelope mass die-off, 2015","summary":"2015 starben in Kasachstan innerhalb weniger Wochen ungeheure Mengen von Saiga-Antilopen. Eine normalerweise vorhandene Bakterienart wurde unter ungewöhnlichen Wetterbedingungen tödlich."},{"id":10,"title":"Lake Nyos disaster, 1986","summary":"1986 strömte nachts Kohlendioxid aus einem kamerunischen Kratersee in umliegende Täler. Rund 1700 Menschen erstickten, ohne überhaupt eine sichtbare Gefahr wahrzunehmen."},{"id":11,"title":"Windsor Hum","summary":"Bewohner der kanadischen Stadt Windsor klagten jahrelang über ein tiefes, störendes Brummen. Die Suche nach der Quelle führte unter anderem zu Industrieanlagen auf Zug Island."},{"id":12,"title":"Kerala red rain, 2001","summary":"In Kerala fiel zeitweise ungewöhnlich rot gefärbter Regen. Die Erklärung durch biologische Partikel konkurrierte öffentlich mit weit spekulativeren Behauptungen über außerirdisches Leben."},{"id":13,"title":"Havana Syndrome","summary":"Diplomaten in verschiedenen Ländern berichteten von auffälligen Geräuschen und gesundheitlichen Beschwerden. Über eine gemeinsame Ursache und die These einer gezielten Energiewaffe besteht keine gesicherte Einigkeit."},{"id":14,"title":"Lady of the Dunes","summary":"Jahrzehntelang blieb eine ermordete Frau in den Dünen von Massachusetts unidentifiziert. Erst genetische Genealogie gab ihr den Namen Ruth Marie Terry zurück."},{"id":15,"title":"Sverdlovsk anthrax leak, 1979","summary":"1979 erkrankten in der sowjetischen Stadt Swerdlowsk zahlreiche Menschen an Milzbrand. Nach jahrelangen Vertuschungsversuchen wurde ein Unfall in einer militärischen Anlage als Ursache anerkannt."},{"id":16,"title":"Beebe, Arkansas bird deaths","summary":"In Arkansas fielen zum Jahreswechsel Tausende Vögel tot vom Himmel. Untersuchungen verbanden das Geschehen mit nächtlichem Aufschrecken und Kollisionen, vermutlich durch Feuerwerk."},{"id":17,"title":"Stuxnet","summary":"Eine hochentwickelte Schadsoftware sabotierte gezielt iranische Urananreicherungs-Zentrifugen. Stuxnet zeigte, dass Computercode reale Industrieanlagen zerstören kann."},{"id":18,"title":"Norway Spiral","summary":"Eine gigantische leuchtende Spirale erschien nachts über Norwegen und löste UFO-Spekulationen aus. Ein misslungener russischer Raketenstart lieferte die Erklärung."},{"id":19,"title":"Max Headroom broadcast intrusion","summary":"1987 drang ein maskierter Unbekannter in zwei Fernsehsendungen in Chicago ein und zeigte bizarre Aufnahmen. Die Verantwortlichen der Signalentführung wurden nie gefasst."},{"id":20,"title":"Spanish Toxic Oil Syndrome, 1981","summary":"1981 erkrankten in Spanien Tausende schwer an einer neuartigen Vergiftung. Die Spur führte zu manipuliertem Speiseöl, nachdem zunächst andere Erklärungen im Umlauf waren."},{"id":21,"title":"Belgian Coca-Cola illness outbreak, 1999","summary":"In Belgien meldeten viele Menschen Beschwerden nach dem Trinken von Coca-Cola-Produkten. Rückrufe folgten; die Untersuchung diskutierte sowohl Verunreinigungen als auch psychogene Faktoren."},{"id":22,"title":"South Asian vulture collapse","summary":"Die Geierpopulationen Südasiens brachen innerhalb weniger Jahre dramatisch ein. Das für Nutztiere verwendete Schmerzmittel Diclofenac vergiftete die Vögel über Kadaver."},{"id":23,"title":"Gloria Ramirez, “The Toxic Lady”","summary":"Als eine sterbende Patientin im Krankenhaus behandelt wurde, kollabierten mehrere Mitarbeiter. Berichte über ungewöhnliche Gerüche führten zu chemischen Hypothesen; die genaue Ursache bleibt strittig."},{"id":24,"title":"Rajneeshee salmonella bioterror attack, 1984","summary":"Anhänger einer religiösen Bewegung kontaminierten in Oregon Restaurant-Salatbars mit Salmonellen, um Wahlen zu beeinflussen. Hunderte erkrankten, ehe die Bioterror-Aktion aufgedeckt wurde."},{"id":25,"title":"Operation Sea-Spray, San Francisco","summary":"Das US-Militär versprühte Bakterien über San Francisco, um deren Ausbreitung zu testen. Die Bewohner wussten von dem geheimen Experiment nichts."},{"id":26,"title":"Goiânia caesium-137 accident, 1987","summary":"Nach dem Diebstahl eines medizinischen Strahlengeräts spielte eine Familie mit blau leuchtendem Material. Das radioaktive Cäsium kontaminierte ganze Wohnbereiche und tötete mehrere Menschen."},{"id":27,"title":"Four Corners hantavirus outbreak, 1993","summary":"Eine rätselhafte Häufung tödlicher Atemwegserkrankungen erschreckte 1993 den Südwesten der USA. Wissenschaftler identifizierten ein Hantavirus, das von Nagetieren übertragen wurde."},{"id":28,"title":"Alexander Litvinenko polonium poisoning","summary":"Ein ehemaliger russischer Geheimdienstmitarbeiter starb in London an Poloniumvergiftung. Ermittler konnten die radioaktive Spur quer durch die Stadt und auf internationalen Reisen verfolgen."},{"id":29,"title":"Kramatorsk radioactive apartment","summary":"Über Jahre starben Bewohner einer Wohnung in der Ukraine an schweren Erkrankungen. In einer Betonwand steckte unbemerkt eine radioaktive Cäsiumquelle."},{"id":30,"title":"Georgi Markov ricin assassination","summary":"Ein bulgarischer Dissident wurde in London scheinbar beiläufig am Bein verletzt und starb kurz darauf. Eine winzige ricinhaltige Kugel deutete auf einen gezielten Mord hin."},{"id":31,"title":"Matsumoto sarin attack","summary":"Eine japanische Sekte setzte Sarin in einer Wohngegend frei, um Menschen zu töten. Die Ermittlungen waren ein Vorzeichen des späteren Anschlags auf Tokios U-Bahn."},{"id":32,"title":"Amerithrax","summary":"Nach dem 11. September trafen Briefe mit Milzbrandsporen bei Medien und Politikern ein. Fünf Menschen starben, die aufwendige FBI-Ermittlung blieb in Teilen umstritten."},{"id":33,"title":"Kim Jong-nam VX assassination","summary":"Der Halbbruder von Kim Jong-un wurde auf einem Flughafen in Kuala Lumpur mit Nervengift angegriffen. Überwachungskameras zeigten, wie zwei Frauen ihm eine Substanz ins Gesicht rieben."},{"id":34,"title":"Viktor Yushchenko dioxin poisoning","summary":"Der ukrainische Politiker Viktor Juschtschenko wurde mit Dioxin vergiftet. Sein dramatisch verändertes Gesicht wurde während des Präsidentschaftswahlkampfs weltweit bekannt."},{"id":35,"title":"Sergei Skripal","summary":"Ein ehemaliger Doppelagent und seine Tochter wurden in England mit Nowitschok vergiftet. Die Untersuchung führte zu russischen Verdächtigen und deckte gefährliche Folgeschäden auf."},{"id":36,"title":"Air France Flight 447","summary":"Ein Passagierflugzeug verschwand nachts über dem Atlantik. Erst die Bergung der Flugschreiber erklärte den Absturz durch vereiste Sensoren, Kontrollverlust und Fehler im Cockpit."},{"id":37,"title":"Mahmoud al-Mabhouh assassination in Dubai","summary":"Ein Hamas-Funktionär wurde in einem Hotel in Dubai ermordet. Überwachungsvideos zeichneten die Bewegungen eines mutmaßlichen Geheimdienstteams mit falschen Pässen auf."},{"id":38,"title":"NotPetya","summary":"Eine als Erpressersoftware getarnte Cyberattacke zerstörte weltweit IT-Systeme großer Unternehmen. NotPetya richtete viel mehr Schaden an als ein gewöhnlicher Erpressungsangriff."},{"id":39,"title":"TRITON","summary":"Angreifer kompromittierten die Sicherheitssteuerung einer Industrieanlage, die normalerweise schwere Unfälle verhindern soll. TRITON verdeutlichte das Risiko gezielter digitaler Industriesabotage."},{"id":40,"title":"Chernobyl first detected in Sweden","summary":"Schwedische Fachleute registrierten plötzlich ungewöhnliche Radioaktivität, obwohl ihre eigenen Anlagen sicher waren. Die Spur zwang die Sowjetunion, den Unfall von Tschernobyl einzugestehen."},{"id":41,"title":"Therac-25 radiation overdoses","summary":"Ein computergesteuertes Bestrahlungsgerät gab Patienten extrem hohe Strahlendosen. Gefährliche Softwarefehler und schwache Sicherheitsmechanismen kamen erst nach mehreren Unfällen ans Licht."},{"id":42,"title":"Ciudad Juárez cobalt-60 contaminated steel","summary":"Ein ausrangiertes medizinisches Strahlengerät geriet in Mexiko in die Schrottverwertung. Radioaktives Kobalt gelangte über Altmetall bis in Stahlprodukte."},{"id":43,"title":"Lia, Georgia RTG radiation accident","summary":"Männer fanden in Georgien kleine, auffallend warme Gegenstände und nutzten sie als Heizquellen. Es handelte sich um hochradioaktive Bestandteile eines alten Generators."},{"id":44,"title":"1976 Philadelphia Legionnaires’ disease outbreak","summary":"Nach einem Veteranenkongress in Philadelphia starben Teilnehmer an einer rätselhaften Lungenentzündung. Forscher identifizierten eine bis dahin unbekannte bakterielle Ursache: Legionellen."},{"id":45,"title":"Best Western Room 225 carbon-monoxide deaths, Boone","summary":"In einem Hotelzimmer starben beziehungsweise erkrankten nacheinander Gäste. Erst später wurde Kohlenmonoxid aus einer technischen Anlage als unsichtbare Ursache erkannt."},{"id":46,"title":"Tokaimura JCO criticality accident, 1999","summary":"Arbeiter in einer japanischen Nuklearfabrik mischten Uranlösung entgegen den Sicherheitsregeln. Eine unkontrollierte Kettenreaktion setzte schwere, teils tödliche Strahlung frei."},{"id":47,"title":"Lake Peigneur disaster, 1980","summary":"Eine Bohrung verband versehentlich einen See in Louisiana mit einem Salzbergwerk. Ein gigantischer Strudel verschluckte Bohrgerät und Ufergelände."},{"id":48,"title":"Boeing 737 rudder-reversal mystery: United 585","summary":"Mehrere Boeing-737-Unglücke blieben zunächst ungeklärt. Die Untersuchung identifizierte schließlich ein Problem mit der Seitenrudersteuerung, das plötzliche Kontrollverluste auslösen konnte."},{"id":49,"title":"King’s Cross fire and the trench effect, 1987","summary":"Ein Feuer unter einer Londoner U-Bahn-Rolltreppe verwandelte sich unerwartet in eine tödliche Feuerwalze. Die Untersuchung entdeckte den damals unterschätzten Trench-Effekt."},{"id":50,"title":"AeroPerú Flight 603","summary":"Nach Wartungsarbeiten waren Messöffnungen an einem Verkehrsflugzeug mit Klebeband verdeckt geblieben. Widersprüchliche Anzeigen verwirrten die Crew und führten zum Absturz ins Meer."},{"id":51,"title":"Malaysia Airlines MH134 A330","summary":"Ein Airbus startete, obwohl noch Abdeckungen auf allen drei Pitot-Sonden steckten. Die Besatzung geriet wegen falscher Geschwindigkeitswerte in erhebliche Schwierigkeiten."},{"id":52,"title":"XL Airways Germany Flight 888T","summary":"Bei einem Testflug lieferten vereiste Anstellwinkelsensoren falsche Daten. Das Schutzsystem des Airbus reagierte nicht wie erwartet, und die Maschine stürzte ab."},{"id":53,"title":"Birgenair Flight 301","summary":"Eine verstopfte Pitot-Sonde zeigte kurz nach dem Start falsche Werte. Die Crew verlor angesichts widersprüchlicher Instrumente die Kontrolle über die Passagiermaschine."},{"id":54,"title":"Guadalajara sewer explosions, 1992","summary":"Aus einer undichten Leitung gelangte Benzin in die Kanalisation von Guadalajara. Gewaltige Explosionen rissen Straßen auf und zerstörten Wohnhäuser."},{"id":55,"title":"Sayano-Shushenskaya hydroelectric disaster, 2009","summary":"Eine riesige Turbine in einem russischen Wasserkraftwerk löste sich aus ihrer Verankerung. Wasser flutete das Maschinenhaus und tötete zahlreiche Beschäftigte."},{"id":56,"title":"Alexander L. Kielland platform collapse, 1980","summary":"Eine Offshore-Wohnplattform kenterte nach dem Bruch einer beschädigten Stahlstrebe. Der Unfall zeigte gravierende Schwachstellen bei Konstruktion und Evakuierung."},{"id":57,"title":"Eschede ICE disaster, 1998","summary":"Ein ICE entgleiste 1998 nach dem Bruch eines Radreifens und prallte gegen eine Brücke. 101 Menschen kamen bei dem Unglück von Eschede ums Leben."},{"id":58,"title":"China Airlines Flight 611","summary":"Eine Passagiermaschine zerbrach während des Flugs, ohne vorherige Notmeldung. Die Ursache lag in einer Jahrzehnte alten, fehlerhaft reparierten Beschädigung des Hecks."},{"id":59,"title":"British Airways Flight 9","summary":"Eine Boeing 747 flog nachts in Vulkanasche und verlor alle vier Triebwerke. Die Piloten konnten mehrere Triebwerke wieder starten und die Maschine landen."},{"id":60,"title":"Hyatt Regency walkway collapse, 1981","summary":"Zwei schwebende Laufstege brachen während einer Veranstaltung in einem Hotel zusammen. Die tödliche Schwachstelle lag in einer geänderten Aufhängungskonstruktion."},{"id":61,"title":"Piper Alpha disaster, 1988","summary":"Eine Ölplattform in der Nordsee wurde von Explosionen und Feuer verwüstet. Fehler in Wartung, Kommunikation und Notfallsystemen verschlimmerten die Katastrophe."},{"id":62,"title":"PEPCON ammonium-perchlorate explosions, 1988","summary":"Eine Fabrik für Raketentreibstoff in Nevada explodierte in einer Serie riesiger Feuerbälle. Die Druckwellen richteten kilometerweit Schäden an."},{"id":63,"title":"Damascus Titan II missile explosion, 1980","summary":"Ein fallendes Werkzeug beschädigte eine mit einem Atom-Sprengkopf bestückte Titan-II-Rakete. Austretender Treibstoff explodierte und schleuderte den Sprengkopf aus dem Silo."},{"id":64,"title":"Qantas Flight 72","summary":"Ein Airbus erlitt während des Flugs plötzlich mehrere heftige Nickbewegungen. Fehlerhafte Daten einer Bordelektronikeinheit brachten Passagiere zu Fall und verletzten viele."},{"id":65,"title":"Bangladesh Bank SWIFT heist, 2016","summary":"Hacker verschafften sich Zugang zum Zahlungssystem der Zentralbank von Bangladesch. Sie veranlassten Überweisungen in Millionenhöhe, von denen ein Teil über Casinos verschwand."},{"id":66,"title":"Ru-106 radioactive cloud over Europe","summary":"Messstationen entdeckten 2017 eine ungewöhnliche Wolke radioaktiven Rutheniums über Europa. Die Spur deutete auf Russland, doch die genaue Freisetzung wurde nicht abschließend geklärt."},{"id":67,"title":"Banco Central Fortaleza tunnel robbery, 2005","summary":"Eine Bande grub einen langen Tunnel unter eine brasilianische Bank und räumte deren Tresor aus. Der präzise vorbereitete Coup brachte eine gewaltige Bargeldbeute."},{"id":68,"title":"Antwerp Diamond Center heist, 2003","summary":"Einbrecher überwanden zahlreiche Sicherungen eines belgischen Diamantentresors. Ihre verblüffend sorgfältige Vorbereitung wurde durch zurückgelassene Spuren zunichtegemacht."},{"id":69,"title":"Banco Río Acassuso “Robbery of the Century”, 2006","summary":"Bankräuber nahmen in Argentinien Geiseln und hielten die Polizei mit Verhandlungen hin. Währenddessen verschwanden sie samt Beute durch einen vorbereiteten Tunnel."},{"id":70,"title":"Isabella Stewart Gardner Museum heist, 1990","summary":"Als Polizisten verkleidete Räuber überwältigten Sicherheitsleute in einem Museum in Boston. Viele der gestohlenen Meisterwerke blieben trotz jahrzehntelanger Fahndung verschwunden."},{"id":71,"title":"Chicago Tylenol cyanide murders, 1982","summary":"Unbekannte vergifteten in Chicago Schmerzmittelkapseln mit Cyanid. Die Todesfälle lösten eine landesweite Panik aus und veränderten Verpackungssicherheitsregeln."},{"id":72,"title":"Erie collar-bomb robbery","summary":"Ein Pizzabote wurde mit einer Bombe am Hals zu einem Bankraub gezwungen und starb bei der Explosion. Später entdeckten Ermittler ein verworrenes Komplott hinter der Tat."},{"id":73,"title":"Clifford Stoll","summary":"Ein Astronom ging einer winzigen Abrechnungsdifferenz in einem Rechnernetz nach. Daraus wurde eine internationale Jagd auf einen Hacker, der Daten für ausländische Spione sammelte."},{"id":74,"title":"Operation Mincemeat, 1943","summary":"Britische Geheimdienstler legten einer Leiche gefälschte geheime Papiere bei. Die Deutschen sollten dadurch an einen falschen Ort für die bevorstehende alliierte Landung glauben."},{"id":75,"title":"Charles Urschel kidnapping","summary":"Gangster entführten einen reichen Geschäftsmann und hielten ihn gegen Lösegeld gefangen. Der Entführte sammelte mit verbundenen Augen Hinweise für die Ermittler."},{"id":76,"title":"Graham Young","summary":"Ein besessener Giftmischer vergiftete zuerst Menschen in seinem Umfeld und später Kollegen. Die zunächst mysteriösen Erkrankungen ließen sich auf seine chemischen Experimente zurückführen."},{"id":77,"title":"Piltdown Man forgery and its exposure, 1912–1953","summary":"Angebliche Fossilien eines frühen Menschen wurden als epochale Entdeckung gefeiert. Jahrzehnte später entlarvten Untersuchungen die Knochen als raffiniert kombinierte Fälschung."},{"id":78,"title":"Chowchilla school-bus kidnapping, 1976","summary":"Drei Männer entführten 1976 einen Schulbus mit Kindern und vergruben die Geiseln in einem Anhänger. Den Eingeschlossenen gelang es, sich selbst freizukämpfen."},{"id":79,"title":"Baker Street bank burglary, 1971","summary":"Eine Bande grub von einem Laden aus in den Tresorraum einer Londoner Bank. Funkgespräche der Einbrecher wurden zufällig mitgehört, doch der Raub gelang zunächst."},{"id":80,"title":"Discovery and identification of Richard III, Leicester, 2012–2013","summary":"Archäologen entdeckten unter einem Parkplatz in Leicester menschliche Überreste. Verletzungen, historische Dokumente und DNA erlaubten die Identifizierung als König Richard III."},{"id":81,"title":"John Snow","summary":"Während einer Choleraepidemie kartierte der Arzt John Snow die Todesfälle um eine Wasserpumpe. Der Fall wurde ein Klassiker der epidemiologischen Spurensuche."},{"id":82,"title":"William Sebold","summary":"Ein vom FBI geführter Doppelagent half, ein deutsches Spionagenetz in den USA zu infiltrieren. Verdeckte Aufnahmen dokumentierten geheime Treffen und führten zu Festnahmen."},{"id":83,"title":"Boston molasses flood and liability investigation, 1919","summary":"Ein riesiger Lagertank barst in Boston und schickte eine Melassewelle durch die Straßen. Menschen starben; die Untersuchung deckte schwere Mängel am Behälter auf."},{"id":84,"title":"Morris worm, 1988","summary":"Ein sich selbst verbreitendes Computerprogramm überlastete 1988 einen großen Teil des frühen Internets. Der Morris-Wurm machte die Risiken vernetzter Systeme schlagartig sichtbar."},{"id":85,"title":"Kuru","summary":"Eine tödliche Hirnerkrankung wurde bei den Fore in Papua-Neuguinea untersucht. Forschungen zeigten den Zusammenhang mit Bestattungsritualen und infektiösen Prionen."},{"id":86,"title":"Minamata methylmercury disease investigation, Japan, 1956–1973","summary":"Menschen an einer japanischen Bucht entwickelten schwere neurologische Schäden. Industrieabwasser hatte Fisch mit Quecksilber vergiftet und damit die Nahrungskette belastet."},{"id":87,"title":"ANOM","summary":"Die Polizei verbreitete einen vermeintlich sicheren verschlüsselten Messenger unter Kriminellen. Tatsächlich lasen Ermittler die Nachrichten mit und organisierten weltweit Festnahmen."},{"id":88,"title":"Crypto AG","summary":"Eine Schweizer Herstellerfirma verkaufte Staaten manipulierte Verschlüsselungstechnik. Geheimdienste konnten dadurch jahrzehntelang als sicher betrachtete Nachrichten mitlesen."},{"id":89,"title":"2011 E. coli O104:H4 outbreak","summary":"2011 erkrankten in Europa zahlreiche Menschen an einem gefährlichen E.-coli-Stamm. Die Suche nach der Ursache führte durch ein komplexes Lebensmittelnetz zu Bockshornkleesamen."},{"id":90,"title":"Silk Road","summary":"Ein riesiger Darknet-Markt handelte mit illegalen Waren über Tor und Bitcoin. Ermittler verknüpften technische und persönliche Spuren bis zum Betreiber Ross Ulbricht."},{"id":91,"title":"AlphaBay","summary":"AlphaBay war einer der größten illegalen Marktplätze im Darknet. Eine internationale Fahndung identifizierte den Betreiber und führte zur Abschaltung des Netzwerks."},{"id":92,"title":"Operation Ivy Bells","summary":"Amerikanische Taucher zapften heimlich ein sowjetisches Untersee-Kommunikationskabel an. Die Spionageoperation wurde durch einen Informanten kompromittiert."},{"id":93,"title":"Hatton Garden safe deposit burglary, 2015","summary":"Eine Bande älterer Einbrecher durchbrach über Ostern eine Betonwand zu Londoner Schließfächern. Ihre große Beute und spätere Festnahme machten den Fall berühmt."},{"id":94,"title":"Volkswagen Dieselgate","summary":"Forscher fanden massive Abweichungen zwischen Abgaswerten auf der Straße und in offiziellen Tests. Die Untersuchung enthüllte manipulierte Diesel-Motorsteuerungen."},{"id":95,"title":"Great Canadian Maple Syrup Heist, 2011–2012","summary":"Diebe stahlen tonnenweise Ahornsirup aus einer kanadischen Reserve und ersetzten Inhalte in Fässern. Der ungewöhnliche Rohstoffdiebstahl beschäftigte lange die Ermittler."},{"id":96,"title":"Operation Bernhard","summary":"Die Nazis ließen KZ-Häftlinge täuschend echte britische Banknoten ulted others, first known murdered Wilma McCann Leeds 30 October 1975. West Yorkshire Police chief investigator George Oldfield. Sutcliffe questioned nine times including November 1977 over £5 banknote connected with Jean Jordan murder. March 1978 Sunderland letters to Oldfield and Daily Mirror alleging Jack the Ripper identity, claiming linked 1975 Joan Harrison murder Preston; B-secretor saliva characteristics on letter seem to corroborate mistakenly connected Preston case."},{"id":181,"title":"1958 Lituya Bay Alaska earthquake megatsunami","summary":"Im Mittelpunkt dieses Falls steht 1958 Lituya Bay Alaska earthquake megatsunami. 9 July 1958 approximately 22:16 local M7.8–7.9 Fairweather fault earthquake. T-shaped fjord with Gilbert Inlet, Crillon Inlet. Geologist Don J Miller 1952–53 researched earlier tree-ring and forest trimlines from 1853–54, approx 1874, 1936, uncertain 1899. Paddy Sherman expedition eight climbers flown from Anchorage Cove campsite shortly before devastation."},{"id":182,"title":"Japanese Fu-Gō balloon bomb campaign World War II 1944–1945","summary":"Im Mittelpunkt dieses Falls steht Japanese Fu-Gō balloon bomb campaign World War II 1944–1945. 4 November 1944 first Pacific US Navy balloon wreck sighting near San Pedro California, Thermopolis Wyoming explosion 6 December, Medford Oregon Jan 1945, January 12 Minton Saskatchewan Ralph Melle and family find dangerous device. US military geologists Julia Gardner, Kenneth and Katherine Lohman and Clarence Ross identify Japanese Honshu beach origins including Ichinomiya and Shiogama via sand ballast mineralogy, marine microfossils, diatoms and foraminifera. Japanese meteorologist Wasaburō Ōishi mapped strong high-altitude jet streams in 1920s and published 1926 in Esperanto. Fu-Gō 10m hydrogen washi-paper balloon, partly assembled by conscripted Japanese schoolgirls with automatic barometric altitude control and sand ballast, incendiary and explosive payloads."},{"id":183,"title":"Cottingley Fairies photographs","summary":"Im Mittelpunkt dieses Falls steht Cottingley Fairies photographs. Cottingley Beck West Yorkshire 1917–1983. Cousins Elsie Wright 16 and Frances Griffiths 9 in 1917 photograph apparently dancing fairies on plates from amateur-photographer father Arthur Wright's camera, two 1917 images. Skeptical father Arthur, more credulous mother Polly Wright. 1919–1920 Polly shares pictures with Bradford Theosophical Society, Edward L Gardner investigates and photographic expert Harold Snelling finds no double exposures or retouching but does not test if subjects were real, modifies enlarged prints for visibility."},{"id":184,"title":"Courrières mining disaster 10 March 1906","summary":"Im Mittelpunkt dieses Falls steht Courrières mining disaster 10 March 1906. Courrières company mines pits no 2 Billy-Montigny, no 3 Méricourt, no 4 Sallaumines northern France, ~1,700 underground and official 1,099 deaths. Regarded as low firedamp and had 1900 Paris exposition safety distinction. March 7 Sainte-Cécile seam fire sealed off, apparently not proven direct trigger. ~06:45 10 March coal dust explosion spreads from suspected voie Lecoeuvre by Joséphine interconnected galleries, ignition remains unresolved, carbon monoxide kills survivors and ventilation destroyed."},{"id":185,"title":"Julia Wallace unsolved murder","summary":"Im Mittelpunkt dieses Falls steht Julia Wallace unsolved murder. Liverpool UK January 1931. Insurance salesman William Herbert Wallace and wife Julia at 29 Wolverton Street Anfield. January 19 1931 about 19:20 anonymous caller identifying as R M Qualtrough asks Liverpool Central Chess Club City Café captain Samuel Beattie to relay to William fictional business appointment at 25 Menlove Gardens East next day 19:30; William arrives club ~20-25 minutes later. January 20 milk boy Alan Close saw Julia alive about 18:30–18:35; William leaves around 18:45, takes public trams to Mossley Hill and asks several witnesses for nonexistent Menlove Gardens East although North South West exist, returns ~20:45."},{"id":186,"title":"Dr Hawley Harvey Crippen","summary":"Im Mittelpunkt dieses Falls steht Dr Hawley Harvey Crippen. Cora Belle Elmore Crippen disappearance murder conviction 1910 and disputed DNA 2010–2025. Cora born Kunigunde Mackamotzki last seen 31 Jan 1910 after dinner with Paul and Clara Martinetti at 39 Hilldrop Crescent Holloway London, theater guild friends challenge sudden disappearance. Husband American doctor homoeopathic salesman gives inconsistent statements wife departed to US, died, later ran off with another man; typist mistress Ethel Le Neve moved into home and wore Cora clothes/jewelry. Chief Inspector Walter Dew interviews Crippen 8 July 1910 without initially enough proof."},{"id":187,"title":"Elmer McCurdy dead outlaw carnival mummy","summary":"Im Mittelpunkt dieses Falls steht Elmer McCurdy dead outlaw carnival mummy. US Kansas Oklahoma California 1911–1977. Elmer born Maine 1880, US Army 1907–1910 then failed bank and train robber with too much nitroglycerin. March 1911 St Louis Iron Mountain Southern train-safe robbery blasts and melts silver. September 1911 Chautauqua Citizens Bank botched safe demolition yields ~$150."},{"id":188,"title":"1928 Italia airship polar disaster Red Tent SOS rescue","summary":"Im Mittelpunkt dieses Falls steht 1928 Italia airship polar disaster Red Tent SOS rescue. Umberto Nobile 1926 Norge North Pole flight with Roald Amundsen, feud over credit, 1928 science expedition supported by Mussolini. Italia ~105m airship arrives Ny-Ålesund May 6 1928, departs May 23 16 people and terrier Titina, reaches North Pole May 24 but landing prevented by weather. May 25 ~10:33 airship crashes on drifting Arctic pack ice after bad weather and altitude loss; Vincenzo Pomella killed on impact, nine survive on ice including Nobile, radio officer Giuseppe Biagi and Finn Malmgren, lighter hydrogen envelope rises again with six missing men aboard never found. Emergency small tent colored red with dye intended for aerial altimetry, Ondina 33 5W radio ~9.1–9.4 MHz and food rescued from wreck, polar bear hunted."},{"id":189,"title":"Great Hedge of India","summary":"Im Mittelpunkt dieses Falls steht Great Hedge of India. Inland Customs Line. British colonial salt tax barrier India ~1803–1879 rediscovered Roy Moxham 1995–2001. Roy Moxham London book conservator notices puzzling reference in William Henry Sleeman Rambles and Recollections of an Indian Official 1995, studies archived inland customs reports. British East India Company salt monopoly and punitive duties in Bengal versus cheaper salt from Sambhar Lake Rajputana, motivates smuggling."},{"id":190,"title":"Zugarramurdi Basque witch trials","summary":"Im Mittelpunkt dieses Falls steht Zugarramurdi Basque witch trials. Alonso de Salazar y Frías Navarre Spanish Inquisition 1608–1620. María de Ximildegui returning from French Labourd accuses neighbor María de Jureteguía of attending Satanic nocturnal gatherings in cave near village, confessions under family and public pressure grow into mass persecution, influenced by Pierre de Lancre witch persecutions across border in France. 1609 Logroño inquisitors Alonso Becerra Holguín and Juan del Valle Alvarado arrest suspected witches, visiting defenders also arrested and August Edict of Faith intensifies compulsory denunciations. Alonso de Salazar y Frías joins tribunal June 1609 and is initially complicit, including support for some interrogation by coercion."},{"id":191,"title":"1831 mystery climate-cooling volcanic eruption identified 2024–25 Zavaritskii caldera on Simushir Kuril Islands","summary":"Im Mittelpunkt dieses Falls steht 1831 mystery climate-cooling volcanic eruption identified 2024–25 Zavaritskii caldera on Simushir Kuril Islands. August 1831 blue green violet suns seen Palermo Sicily, Saint-Sever France, Alexandria and Norfolk Virginia, New Orleans, including Benjamin Hallowell Aug 13 Virginia description of green-blue sun and haze. Felix Mendelssohn records cold wet 1831 Alpine summer, 1831–33 Northern Hemisphere roughly 1 C cooling affecting agriculture India and Japan though not sole cause famines. July–August 1831 Mediterranean underwater Ferdinandea Graham Island Julia erupts near Sicily, island briefly claimed by Kingdom of Two Sicilies, Britain and France, vanishes by December. Widely listed large Babuyan Claro Philippines 1831 eruption traced by Garrison Kilburn Edwards 2018 Journal of Applied Volcanology to misreading 1835 travel account Franz Julius Ferdinand Meyen never describing contemporaneous eruption, Leopold von Buch 1836, Karl Sapper 1917 repeated legend possibly older 1681 activity."},{"id":192,"title":"Tichborne Claimant imposture","summary":"Im Mittelpunkt dieses Falls steht Tichborne Claimant imposture. Arthur Orton vs long lost Roger Charles Doughty Tichborne 1854–1898. Authentic Roger born Paris 5 January 1829 raised French-speaking, joins 6th Dragoon Guards 1849–52, rejected marriage to cousin Katherine Doughty, tours Chile Argentina Brazil 1853–54, boards ship Bella Rio 20 April 1854 lost at sea by April 24, presumed dead 1855. Mother Henriette Félicité Lady Tichborne pursues reports of survivors carried by Osprey to Australia, places international missing-person adverts 1863–65. Indebted obese butcher Wagga Wagga Australia calling himself Thomas Castro claims to be Roger 1865–66 to lawyer William Gibbes, writes Lady Tichborne."},{"id":193,"title":"1858 Bradford sweets poisoning UK accidental arsenic mass poisoning","summary":"Im Mittelpunkt dieses Falls steht 1858 Bradford sweets poisoning UK accidental arsenic mass poisoning. 30 October 1858 Saturday Green Market William Hardaker alias Humbug Billy sells ~1000 darkened peppermint humbugs made by Joseph Neal Stone Street, haggles cheaper price after noting unusual color, eats some and becomes ill, assistant sells through late evening. 31 Oct multiple children including Elijah Wright age 9, Joseph Scott age 14, Orlando and John Henry Burran die with vomiting, cramps mistaken initially for cholera by surgeon John Roberts. Physician John Henry Bell notes Burran family eaten same humbugs, chemist Felix Marsh Rimmington analyzes and identifies arsenic trioxide in high concentrations. Chief constable William Leveratt warns with bells and street criers, posters tavern police messages, confiscates ~16kg unsold sweets but many scattered among families."},{"id":194,"title":"Juan Pujol García GARBO ARABEL WWII British MI5 double agent with German Abwehr fictitious spy network 1941–1988","summary":"Im Mittelpunkt dieses Falls steht Juan Pujol García GARBO ARABEL WWII British MI5 double agent with German Abwehr fictitious spy network 1941–1988. Born Barcelona 1912, anti-fascist after Spanish Civil War, rebuffed three times by British intelligence Madrid/Lisbon 1941. Instead offers to spy on UK for Nazis posing fascist Spanish official, Abwehr teaches secret inks and pays him; based Lisbon without ever travelling to UK, invents seemingly British reports by guidebook Blue Guide and reference reading including error Glaswegians prefer a litre of wine, Germans believe him. Invents agents all over UK and their relationships, eventual ~27 fictitious spies (not necessarily active simultaneously), some Venezuelan in Glasgow, Welsh nationalist, soldiers, radio engineer; 1942 British discovers through intercepts, MI5 recruits him, arrives Britain April 1942, handler Tomás 'Tommy' Harris MI5 B1A, UK codename GARBO Germany ARABEL. 315 long letter transmissions averaging ~2000 words in secret ink via Lisbon, then radio August 1943 onward."},{"id":195,"title":"Greenbrier Ghost","summary":"Im Mittelpunkt dieses Falls steht Greenbrier Ghost. Elva Zona Heaster Shue. Greenbrier County West Virginia January–July 1897. Eleven-year-old Anderson Jones discovers Zona dead. Husband prevents thorough first neck examination."},{"id":196,"title":"London Beer Flood","summary":"Im Mittelpunkt dieses Falls steht London Beer Flood. Horse Shoe Brewery Meux & Co. 17 October 1814 St Giles Rookery London. George Crick notices slipped iron hoop on massive wooden porter vat and reports it as routine. Vat bursts around 5:30pm, destroys adjacent vessels and brewery wall."},{"id":197,"title":"Great Moon Hoax 1835","summary":"Im Mittelpunkt dieses Falls steht Great Moon Hoax 1835. New York Sun six Great Astronomical Discoveries articles 25–31 August. Real British astronomer John Herschel at Cape of Good Hope falsely credited with giant 24-foot 7-ton lens telescope and 42000 magnification. Fictional scientific assistant Dr Andrew Grant. Fake supplement of defunct Edinburgh Journal of Science."},{"id":198,"title":"Blanche Monnier","summary":"Im Mittelpunkt dieses Falls steht Blanche Monnier. La Séquestrée de Poitiers. Poitiers France 1875–1913. May 23 1901 anonymous letter to prosecutor describing woman secluded and starving for 25 years in respectable Monnier family home 21 rue de la Visitation. Police discover 52-year-old Blanche severely emaciated approximately 25kg in dark squalid room."},{"id":199,"title":"Kaspar Hauser mystery","summary":"Im Mittelpunkt dieses Falls steht Kaspar Hauser mystery. Nuremberg Bavaria 26 May 1828 unknown teenage boy with limited speech carrying two anonymous letters to cavalry officer Friedrich von Wessenig and able to write Kaspar Hauser. Claimed childhood locked in tiny dark cell with bread water wooden horse anonymous keeper. Georg Friedrich Daumer education from July 1828. Rumored replaced baby son of Baden Grand Duke Karl and Stéphanie de Beauharnais 1812."},{"id":200,"title":"Gregor MacGregor Poyais scheme 1820–1845","summary":"Im Mittelpunkt dieses Falls steht Gregor MacGregor Poyais scheme 1820–1845. Scottish former South American independence officer receives actual large land concession from Miskitu king George Frederic Augustus at Mosquito Coast 1820. Returns London 1821 as Cazique of Poyais with wife Josefa as princess. Promotes allegedly developed Central American sovereign state and capital St Joseph via 1822 Thomas Strangeways Sketch of the Mosquito Shore guidebook, fictional institutions and infrastructure. London Poyais land deeds banknotes and nominal £200000 government bond issue 1822–23."},{"id":201,"title":"Devil’s Footprints","summary":"Im Mittelpunkt dieses Falls steht Devil’s Footprints. Great Devon Mystery February 8–9 1855 England. After overnight snow rain easterly wind frost horseshoe or cloven-hoof shaped prints approximately 8–14 inches spaced in single-file patterns reported Exmouth Littleham Lympstone Woodbury Topsham Dawlish Teignmouth and elsewhere. Witnesses allege tracks cross high walls fences roofs and gardens without obvious interruption. Newspaper accounts Illustrated London News February 24 and March 10 1855 amplify purported trail up to 40–100 miles and impossible crossing of Exe estuary."},{"id":202,"title":"Great Toronto Stork Derby","summary":"Im Mittelpunkt dieses Falls steht Great Toronto Stork Derby. Charles Vance Millar will and inheritance contest Canada 1926–1938. Wealthy eccentric unmarried Toronto attorney investor dies October 31 1926. Will leaves jointly held Jamaican holiday house to antagonistic lawyers, O Keefe brewery shares to anti-alcohol Methodist ministers and Ontario Jockey Club shares to anti-gambling advocates. Principal remainder invested 10 years and awarded to woman in Toronto who bears most registered children October 31 1926–October 31 1936, tied winners divide."},{"id":203,"title":"Strasbourg Dancing Plague","summary":"Im Mittelpunkt dieses Falls steht Strasbourg Dancing Plague. Tanzwut 1518 Alsace Holy Roman Empire. July 1518 woman later named Frau Troffea begins apparently uncontrollable dancing for days. Others join, dozens confirmed through chronicle reports with later claim up to ~400 uncertain. Stress famine disease economic distress and widely believed St Vitus dancing curse."},{"id":204,"title":"Great Boston Molasses Flood 15 January 1919","summary":"Im Mittelpunkt dieses Falls steht Great Boston Molasses Flood 15 January 1919. Purity Distilling Company United States Industrial Alcohol 50ft high 90ft wide steel tank Commercial Street Boston North End. 2.3 million US gallons molasses stored after January 12 delivery. Around 12:30pm tank bursts, huge molasses wave estimated 35mph destroys buildings, elevated rail support and firefighting facilities. 21 dead 150 injured, including schoolchildren, workers and firefighters."},{"id":205,"title":"Carl Tanzler alias Count Carl von Cosel","summary":"Im Mittelpunkt dieses Falls steht Carl Tanzler alias Count Carl von Cosel. Elena María Milagro de Hoyos Mesa. Key West Florida 1930–1952. German-born hospital radiology technician Tanzler meets 20-year-old Elena with tuberculosis April 22 1930 and claims childhood visions revealed she was destined bride. Married older Tanzler obsessively treats her with ineffective medicines x-rays and gifts despite no evidence she reciprocated."},{"id":206,"title":"Mechanical Turk Schachtürke Wolfgang von Kempelen chess automaton 1770–1854","summary":"Im Mittelpunkt dieses Falls steht Mechanical Turk Schachtürke Wolfgang von Kempelen chess automaton 1770–1854. Circa 1770 Wolfgang von Kempelen presents cabinet with turbaned humanoid chess figure to Maria Theresa Vienna. Opens cabinet doors to reveal gears and apparently empty compartments, machine seems to select moves and beat skilled opponents. European tours Paris London. Inventor dies 1804 and showman Johann Nepomuk Mälzel acquires chess automaton, tours Europe and America from 1826."},{"id":207,"title":"1904 St Louis Olympics marathon August 30 1904","summary":"Im Mittelpunkt dieses Falls steht 1904 St Louis Olympics marathon August 30 1904. 32 starters approximately 40km 24.85-mile race afternoon 3:03pm in ~32C heat and humidity on hilly rough dusty unclosed roads with horses carriages streetcars and automobile escorts. Organizer James Edward Sullivan allows only one official water station about halfway for purposeful dehydration research. Cuban former postman Félix Andarín Carvajal impoverished after journey starts in street clothes cut-off trousers and shoes, reportedly eats peaches rotten apples and naps due cramps, eventually finishes fourth, exact anecdotes partly embroidered. South Africans Len Taunyane and Jan Mashiani among first Black Africans in modern Olympics, originally participants in exploitative 1904 World's Fair displays, finish 9th 12th, alleged stray dog chase unconfirmed."},{"id":208,"title":"Anna Anderson","summary":"Im Mittelpunkt dieses Falls steht Anna Anderson. Franziska Schanzkowska Anastasia Romanov claimant 1920–2009. Nameless young woman rescued February 1920 after jumping into Berlin Landwehrkanal, admitted to Dalldorf psychiatric asylum as Fräulein Unbekannt. Fellow patient Klara Peuthert around 1922 recognizes resemblance to Russian Tsar family princesses from photograph. Woman alleges she is Grand Duchess Anastasia, survivor of July 17 1918 execution of Tsar Nicholas II, Tsarina Alexandra and their five children in Ipatiev House Yekaterinburg, rescued by sympathetic guard, escaped Russia."},{"id":209,"title":"Radium Girls","summary":"Im Mittelpunkt dieses Falls steht Radium Girls. Radioactive dial painters Grace Fryer and colleagues New Jersey, Illinois and Connecticut 1917–1939. Young female factory workers at Radium Luminous Material Corporation later U.S. Radium Corporation Orange NJ paint glowing watch and military dials using radium plus zinc sulfide Undark. Supervisors direct repeated lip-pointing of camel-hair brush for precision causing ingestion of radium, women sometimes paint nails and teeth and glow from dust. Beginning 1921 mysterious teeth loosening jaw necrosis severe anemia bone fractures and cancer."},{"id":210,"title":"Abraham Lincoln corpse theft attempt","summary":"Im Mittelpunkt dieses Falls steht Abraham Lincoln corpse theft attempt. Springfield Illinois Oak Ridge Cemetery 1876–1901. Chicago counterfeiting boss James Big Jim Kinealy Kennally. Imprisoned expert banknote engraver Benjamin Boyd. First July 1876 attempted plot betrayed after brothel boast."},{"id":211,"title":"Beast of Gévaudan","summary":"Im Mittelpunkt dieses Falls steht Beast of Gévaudan. Bête du Gévaudan France 1764–1767. First recorded victim Jeanne Boulet 30 June 1764 Les Hubacs Saint-Étienne-de-Lugdarès. Roughly 80–124 deaths mostly women and children. Eyewitness descriptions huge reddish striped wolf-like predator attacks humans rather than livestock."},{"id":212,"title":"Mina Stinson Crandon alias Margery Boston Lime Street 1923–1941","summary":"Im Mittelpunkt dieses Falls steht Mina Stinson Crandon alias Margery Boston Lime Street 1923–1941. Surgeon husband Le Roi Goddard Crandon. May 1923 table tipping sessions. Purported channeling dead brother Walter Stinson killed in railroad accident. Spirit voices, electric bell box, table movements and flying megaphone."},{"id":213,"title":"Who put Bella in the Wych Elm","summary":"Im Mittelpunkt dieses Falls steht Who put Bella in the Wych Elm. Hagley Wood Worcestershire UK 1941–2026. 18 April 1943 four boys Robert Hart Tommy Willetts Bob Farmer Fred Payne discover woman skull in hollow wych elm on Hagley Estate. Skeleton estimated woman around 35 age, 5 ft tall, crooked overlapping incisors, possible previous childbirth. Mustard skirt blue yellow striped cardigan peach taffeta underskirt crepe-soled shoes cheap wedding ring."},{"id":214,"title":"HMS Thetis","summary":"Im Mittelpunkt dieses Falls steht HMS Thetis. HMS Thunderbolt British Royal Navy T-class submarine double sinking 1939–1943. Built by Cammell Laird Birkenhead launched June 29 1938, final dive trials Liverpool Bay 1 June 1939. 103 aboard including ~50 additional shipyard workers Admiralty observers officers caterers and pilot. Commanding officer Lt Cdr Guy Bolus, observer Captain Harry Oram, torpedo officer Lt Frederick Woods."},{"id":215,"title":"Dreyfus Affair","summary":"Im Mittelpunkt dieses Falls steht Dreyfus Affair. Affaire Dreyfus France 1894–1908. September 1894 German embassy Paris wastepaper spy Marie Bastian retrieves torn unsigned bordereau describing French military secrets addressed to German attaché Maximilian von Schwartzkoppen. Captain Alfred Dreyfus Jewish Alsatian French artillery officer wrongly suspected, handwriting dictation interrogation by Armand du Paty de Clam October 15 1894. Controversial experts including Alphonse Bertillon self-forgery theory vs Alfred Gobert handwriting discrepancies, note mentions manoeuvres Dreyfus was not attending."},{"id":216,"title":"Dr James Barry","summary":"Im Mittelpunkt dieses Falls steht Dr James Barry. Margaret Ann Bulkley British army surgeon identity mystery Ireland Edinburgh British Empire 1789–1865. Margaret born c1789 Cork to Mary Ann and Jeremiah Bulkley, family ruined after son John financial obligations, Margaret and mother seek support from painter uncle James Barry Royal Academy died 1806. Physician Edward Fryer, Venezuelan revolutionary Francisco de Miranda and Earl of Buchan educational support, planned possible medical career in liberated Venezuela conjectural. Late November 1809 Margaret takes male name James Barry and travels with mother Mary Ann Bulkley posing as aunt to Edinburgh University, private letters instruct solicitor Daniel Reardon to forward Irish mail in new envelopes, not disclose identity."},{"id":217,"title":"Pepsi Number Fever","summary":"Im Mittelpunkt dieses Falls steht Pepsi Number Fever. Philippines 349 bottle-cap lottery fiasco 1992–2006. Pepsi-Cola Products Philippines and PepsiCo promotion Feb 17–May 8 1992 extended through June 12. Pepsi 7 Up Mirinda Mountain Dew bottle crowns three-digit numbers with printed peso prize amounts and separate seven-character alphanumeric security codes. Mexican marketing consultant D.G. Consultores predetermines winning number-code combinations."},{"id":218,"title":"Clever Hans","summary":"Im Mittelpunkt dieses Falls steht Clever Hans. Der Kluge Hans Berlin Germany 1904–1912. Retired teacher Wilhelm von Osten trains horse Hans using school-like lessons, number charts, counting boards, arithmetic spelling and calendar exercises, hoof tapping gives answers. Public demonstrations summer 1904 correct answers even to strangers and without trainer present. Scientist zoologist Carl Georg Schillings initially skeptical but elicits correct responses himself."},{"id":219,"title":"J Harlen Bretz Channeled Scablands","summary":"Im Mittelpunkt dieses Falls steht J Harlen Bretz Channeled Scablands. Glacial Lake Missoula megaflood mystery Washington Montana Idaho Oregon 1910–1981. 1910 former schoolteacher and geologist Bretz sees maps of weird giant dry waterfall and basins in Washington. Joseph Thomas Pardee separately discovers glacial Lake Missoula giant ancient mountain shoreline marks Montana from 1910. Bretz field studies start summer 1922 in Columbia Plateau with wife Fanny children students, mapped enormous dry coulees basalt scour giant potholes far-travelled granite erratics and Dry Falls roughly 120 m high many times Niagara width."},{"id":220,"title":"Cardiff Giant","summary":"Im Mittelpunkt dieses Falls steht Cardiff Giant. Der Riese von Cardiff New York USA archaeological petrified giant hoax 1866–1947. 16 October 1869 workmen Gideon Emmons and Henry Nichols digging unusual well behind farmer William Stub Newell barn Cardiff Onondaga County discover huge 10 ft 4 in roughly 3000 lb human figure about 3 feet below soil, one exclaims old Indian buried here. Alleged petrified prehistoric or Biblical giant, oddly twisted body, skin pores and water grooves, thousands of visitors. Newell puts up tent admission 25 cents rising to 50 cents after two days."},{"id":221,"title":"Alfred Redl","summary":"Im Mittelpunkt dieses Falls steht Alfred Redl. K.u.k. Evidenzbüro Vienna Prague Russian espionage scandal 1899–1913. Colonel Alfred Redl born 1864 Lemberg, polyglot Austrian-Hungarian officer joins intelligence Evidenzbüro in 1899, leads agent operations by 1905 and deputy director 1907–1911, promotes technical surveillance fingerprint and photography. 1912 chief of staff VIII Army Corps Prague. Secretly serves Russian military intelligence by at latest 1907 perhaps before 1903, code name Agent 25, sells mobilization plans, strategic deployment and order of battle for Russia Serbia Italy, Austrian intelligence methods and agent information; also linked to French and Italian contacts."},{"id":222,"title":"HMS Wager shipwreck mutiny Patagonia Chile Brazil 1740–1746","summary":"Im Mittelpunkt dieses Falls steht HMS Wager shipwreck mutiny Patagonia Chile Brazil 1740–1746. George Anson eight-ship squadron September 1740 Portsmouth expedition to attack Spanish possessions and seize Manila galleon. HMS Wager former merchant store-ship heavily laden with guns supplies and infirm soldiers, initial crew approx 250, Captain Dandy Kidd dies and David Cheap takes command. Typhus scurvy and Cape Horn storms damage rigging, missing mizzenmast, sailors severely weakened. Officers fear lee shore and advise westward course but Cheap pursues north rendezvous with squadron."},{"id":223,"title":"Robert Hendy-Freegard","summary":"Im Mittelpunkt dieses Falls steht Robert Hendy-Freegard. David Hendy 'Puppet Master' fake MI5 spy coercive-control fraud UK and France 1992–2025. Born 1971 Worksop Nottinghamshire, barman The Swan Newport Shropshire 1992–1993 manipulates Harper Adams agricultural students John Atkinson Sarah Smith Maria Hendy by inventing IRA terrorist cell and covert Special Branch MI5 work, exploits grief over friend Garry's death; gives Atkinson supposed loyalty trials and beatings. Persuades Atkinson to feign terminal liver cancer so Smith Hendy join supposed farewell trip Easter 1993, then announces their covers blown and all three are in danger from IRA, moves them through safe houses Sheffield. Isolates from family, controls money wages savings, coerces hiding under a bucket or three weeks in bathroom, forces humiliating missions, Smith spends about 10 years under influence, Hendy eight years and has two daughters, Atkinson and family lose about £390,000, Smith family about £180,000."},{"id":224,"title":"John Thomson Stonehouse","summary":"Im Mittelpunkt dieses Falls steht John Thomson Stonehouse. British Labour MP faked Miami drowning Melbourne Australia 1974–1979. Former Postmaster General Technology minister MP for Walsall North with wife Barbara and affair with secretary Sheila Buckley, debt and suspected fraudulent business transactions through British Bangladesh Trust London Capital Group in 1970s. July 15 and 17 1974 forged birth certificate applications for dead constituents Donald C Mildoon and Joseph Arthur Markham, August 1 bogus Markham passport application, documented in House of Commons Hansard July 21 1975. 20 November 1974 Fontainebleau Miami Beach business trip with barrister James Overton Charlton, leaves clothes by beach cabana, personal passport watch about USD800 travellers checks in hotel room, presumed drowned despite no body, newspapers report death."},{"id":225,"title":"U.S. Navy Mark 14","summary":"Im Mittelpunkt dieses Falls steht U.S. Navy Mark 14. Mk XIV torpedo scandal 1941–1943. Mk 6 magnetic exploder. WWII Pacific submarines USS Sargo USS Skipjack USS Tunney USS Tinosa. U.S. Naval Torpedo Station Newport Rhode Island and Bureau of Ordnance BuOrd designed Mark 14 submarine torpedo 1930s with magnetic influence device intended to detonate below enemy keel, tested mostly with practice warheads not full live production shots, design secret even from enlisted torpedomen."},{"id":226,"title":"Stephane Breitwieser","summary":"Im Mittelpunkt dieses Falls steht Stephane Breitwieser. Stéphane Breitwieser prolific art theft and destruction of stolen collection France Switzerland Belgium Europe 1994–2023. Alsatian French waiter antique obsessive childhood passion Renaissance
